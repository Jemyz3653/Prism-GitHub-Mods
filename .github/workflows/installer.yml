name: Test Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - '.github/workflows/installer.yml'
  workflow_dispatch:
    inputs:
      test_release:
        description: Install and launch the published v0.1.0 package in a temporary profile
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Test package validation and build the EXE
        working-directory: installer
        shell: pwsh
        run: |
          go test -v ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../out/Prism-GitHub-Mods-Setup-x64.exe .
          exit $LASTEXITCODE
      - name: Load installer window and verify controls
        shell: powershell
        run: |
          $source = [IO.File]::ReadAllText((Join-Path $PWD 'installer/setup.ps1'))
          $mark = $source.LastIndexOf('$timer.Start()')
          if ($mark -lt 0) { throw "Could not locate installer startup" }
          $test = @'
          foreach ($name in 'Prism','Data','Music','Pause','Stop','Motion','Install','Open','Star') {
              if (-not $e[$name]) { throw "Missing control $name" }
          }
          if (-not $e.Motion.IsChecked -or $e.Pause.IsEnabled -or $e.Open.IsEnabled) {
              throw "Unexpected initial control state"
          }
          $size = New-Object Windows.Size(840,500)
          $point = New-Object Windows.Point(0,0)
          $window.Content.Measure($size)
          $window.Content.Arrange((New-Object Windows.Rect($point,$size)))
          $window.Content.UpdateLayout()
          $bitmap = New-Object Windows.Media.Imaging.RenderTargetBitmap(840,500,96,96,[Windows.Media.PixelFormats]::Pbgra32)
          $bitmap.Render($window.Content)
          $encoder = New-Object Windows.Media.Imaging.PngBitmapEncoder
          $encoder.Frames.Add([Windows.Media.Imaging.BitmapFrame]::Create($bitmap))
          $stream = [IO.File]::Create((Join-Path $PWD 'out/Installer-preview.png'))
          try { $encoder.Save($stream) } finally { $stream.Dispose() }
          $window.Close()
          '@
          & ([ScriptBlock]::Create($source.Substring(0,$mark) + $test))
      - name: Install published preview in a temporary profile
        if: inputs.test_release
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'Prism GitHub test'
          $data = Join-Path $temp 'Prism data'
          $worker = Join-Path $temp 'Installer request'
          New-Item -ItemType Directory -Force $data, $worker | Out-Null
          $env:LOCALAPPDATA = Join-Path $temp 'LocalAppData'
          $original = Join-Path $temp 'prismlauncher.exe'
          $setup = (Resolve-Path out/Prism-GitHub-Mods-Setup-x64.exe).Path
          Copy-Item $setup $original
          $originalHash = (Get-FileHash $original).Hash
          $config = Join-Path $data 'prismlauncher.cfg'
          Set-Content -Encoding ascii $config 'MCLaunchMethod=LauncherPart'
          $configHash = (Get-FileHash $config).Hash
          @{ Original = $original; Data = $data } |
            ConvertTo-Json -Compress | Set-Content -Encoding utf8NoBOM (Join-Path $worker 'request.json')
          $process = Start-Process -FilePath $setup -ArgumentList ('--install "' + $worker + '"') -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Installer backend timed out.' }
          $result = Get-Content -Raw (Join-Path $worker 'result.json') | ConvertFrom-Json
          if (-not $result.Done -or $result.Error) { throw "Installer failed: $($result.Error)" }
          if (-not (Test-Path $result.Exe) -or $result.Data -ne $data) { throw 'Wrong installation path.' }
          if ((Get-FileHash $original).Hash -ne $originalHash -or (Get-FileHash $config).Hash -ne $configHash) {
            throw 'Installation modified the existing Prism files.'
          }
          $live = Join-Path $data 'live.check'
          $process = Start-Process -FilePath $result.Exe -ArgumentList ('--alive --dir "' + $data + '"') -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(35)
            while (-not (Test-Path -LiteralPath $live) -and -not $process.HasExited -and [DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path -LiteralPath $live)) { throw 'Installed Prism did not start.' }
            Write-Host 'Release unpacked without modifying the original executable or configuration. Installed Prism started.'
          } finally {
            if (-not $process.HasExited) { $process.Kill() }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: Prism-GitHub-Installer
          path: out/*
          if-no-files-found: error
