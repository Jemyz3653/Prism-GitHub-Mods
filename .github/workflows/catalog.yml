name: Discover public mod releases

on:
  push:
    branches: [main]
    paths:
      - 'tools/discover_catalog.py'
      - 'tools/test_discover_catalog.py'
      - '.github/workflows/catalog.yml'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-mod-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test catalog validation
        run: python3 -m unittest discover -s tools -p test_discover_catalog.py
      - name: Search and verify GitHub release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/discover_catalog.py
      - uses: actions/upload-artifact@v7
        with:
          name: verified-mod-catalog
          path: out/
          if-no-files-found: error
          retention-days: 7
