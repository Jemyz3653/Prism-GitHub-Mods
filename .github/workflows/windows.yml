name: Build patched Prism for Windows

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: PrismLauncher/PrismLauncher
          ref: 7d2d3c1ec6fcf8255ebacd02d9f792688575dfb4
          path: upstream
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git
          pacboy: >-
            toolchain:p cmake:p extra-cmake-modules:p ninja:p qt6-base:p
            qt6-svg:p qt6-imageformats:p qt6-networkauth:p cmark:p
            qrencode:p tomlplusplus:p libarchive:p
      - name: Patch and build
        shell: msys2 {0}
        env:
          BUILD_PLATFORM: detemkur
        run: |
          cd upstream
          git apply --check ../patches/github-mods.patch
          git apply ../patches/github-mods.patch
          cmake --preset windows_mingw -DENABLE_LTO=OFF -DLauncher_UPDATER_GITHUB_REPO= -DBUILD_TESTING=OFF
          cmake --build --preset windows_mingw --config Release --parallel 6
          cmake --install build --config Release
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Package patched Prism and installer
        shell: pwsh
        run: |
          $launcher = (Resolve-Path upstream/install/prismlauncher.exe).Path
          $null = Resolve-Path upstream/install/platforms/qwindows.dll
          New-Item -ItemType Directory -Force out
          Push-Location installer
          try {
            go test ./...
            if ($LASTEXITCODE -ne 0) { throw "Installer tests failed." }
            go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../out/Prism-GitHub-Mods-Setup-x64.exe .
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }
          } finally { Pop-Location }
          Compress-Archive -Path upstream/install/* -DestinationPath out/Prism-11.1.1-GitHub-Windows-x64.zip
          (Get-FileHash out/Prism-11.1.1-GitHub-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -Encoding ascii out/Prism-11.1.1-GitHub-Windows-x64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: Prism-GitHub-Windows-x64
          path: out/*
          if-no-files-found: error


      - name: Smoke test Prism with a temporary data directory
        shell: pwsh
        run: |
          $launcher = (Resolve-Path upstream/install/prismlauncher.exe).Path
          $data = Join-Path $env:RUNNER_TEMP 'prism-launch-smoke'
          New-Item -ItemType Directory -Force $data | Out-Null
          $check = Join-Path $data 'live.check'
          $proc = Start-Process -FilePath $launcher -WorkingDirectory (Split-Path $launcher) -ArgumentList ('--alive --dir "' + $data + '"') -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(35)
            while (-not (Test-Path -LiteralPath $check) -and -not $proc.HasExited -and [DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path -LiteralPath $check)) { throw 'Prism did not start with the temporary data directory.' }
            Write-Host 'Patched Prism started and wrote live.check.'
          } finally {
            if (-not $proc.HasExited) { $proc.Kill() }
          }
